<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central do Operador</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f3f4f6;color:#111827}.top{background:#111827;color:#fff}.bar{width:min(1120px,calc(100% - 32px));margin:auto;min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}.bar h1{margin:0;font-size:23px}.bar p{margin:4px 0 0;color:#d1d5db;font-size:13px}.btn{border:0;border-radius:9px;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer}.light{background:#fff;color:#111827}.primary{background:#111827;color:#fff}.blue{background:#2563eb;color:#fff}.red{background:#dc2626;color:#fff}.gray{background:#e5e7eb;color:#374151}.page{width:min(1120px,calc(100% - 32px));margin:32px auto}.grid{display:grid;grid-template-columns:360px 1fr;gap:22px}.panel{background:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(15,23,42,.08);padding:22px}h2{margin:0 0 18px}.field{margin-bottom:14px}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}input{width:100%;border:1px solid #d1d5db;border-radius:9px;padding:11px 12px;font:inherit}.info{font-size:13px;color:#6b7280;line-height:1.5}.msg{min-height:20px;font-size:14px}.ok{color:#047857}.err{color:#b91c1c}.list{display:grid;gap:12px}.user{border:1px solid #e5e7eb;border-radius:12px;padding:16px}.user-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px}.user h3{margin:0 0 4px}.meta{font-size:13px;color:#6b7280;line-height:1.6}.tag{display:inline-block;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800}.active{background:#dcfce7;color:#166534}.inactive{background:#fee2e2;color:#991b1b}.temp{background:#fef3c7;color:#92400e}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.actions .btn{padding:8px 10px;font-size:13px}.empty{text-align:center;color:#6b7280;padding:30px}@media(max-width:800px){.grid{grid-template-columns:1fr}.bar{align-items:flex-start;flex-direction:column;padding:17px 0}}</style></head><body><header class="top"><div class="bar"><div><h1>Central do Operador</h1><p>Gerenciamento separado das contas administrativas</p></div><button id="sair" class="btn light">Sair</button></div></header><main class="page"><div class="grid"><section class="panel"><h2>Criar administrador</h2><form id="novoForm"><div class="field"><label>Nome</label><input id="nome" maxlength="80" required></div><div class="field"><label>Usuário</label><input id="username" maxlength="32" required></div><div class="field"><label>Senha temporária</label><input id="senha" type="password" minlength="8" required></div><p class="info">A senha temporária deve conter letra maiúscula, minúscula e número. No primeiro login, o administrador será obrigado a criar uma nova senha.</p><button class="btn primary" style="width:100%">Criar conta</button><p id="msg" class="msg"></p></form></section><section class="panel"><h2>Administradores</h2><div id="lista" class="list"></div></section></div></main><script>
let csrfToken='';

async function iniciarSessao(){
  const r=await fetch('/api/operador/sessao',{cache:'no-store'});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){location.href='/operador-login';return false}
  csrfToken=d.csrfToken||'';
  return true;
}

async function api(url,op={}){
  const metodo=(op.method||'GET').toUpperCase();
  const headers=new Headers(op.headers||{});
  if(metodo!=='GET'&&metodo!=='HEAD') headers.set('X-CSRF-Token',csrfToken);
  const r=await fetch(url,{...op,headers,cache:'no-store'});
  const d=await r.json().catch(()=>({}));
  if(r.status===401){location.href='/operador-login';throw new Error('sessao')}
  if(!r.ok)throw new Error(d.mensagem||'Erro na operação.');
  return d;
}
function data(v){if(!v)return 'Nunca';return new Date(v).toLocaleString('pt-BR')}
async function carregar(){try{const dados=await api('/api/operador/administradores');lista.innerHTML='';if(!dados.length){lista.innerHTML='<div class="empty">Nenhum administrador cadastrado.</div>';return}for(const u of dados){const el=document.createElement('div');el.className='user';el.innerHTML=`<div class="user-head"><div><h3>${esc(u.nome)}</h3><div class="meta">Usuário: <b>${esc(u.username)}</b><br>Último login: ${data(u.ultimoLogin)}</div></div><div>${u.ativo?'<span class="tag active">ATIVO</span>':'<span class="tag inactive">INATIVO</span>'} ${u.trocarSenha?'<span class="tag temp">SENHA TEMPORÁRIA</span>':''}</div></div><div class="actions"><button class="btn gray" data-edit>Editar</button><button class="btn blue" data-reset>Redefinir senha</button><button class="btn ${u.ativo?'red':'primary'}" data-status>${u.ativo?'Desativar':'Ativar'}</button></div>`;el.querySelector('[data-edit]').onclick=()=>editar(u);el.querySelector('[data-reset]').onclick=()=>reset(u);el.querySelector('[data-status]').onclick=()=>status(u);lista.appendChild(el)}}catch(e){if(e.message!=='sessao')lista.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function editar(u){const n=prompt('Nome do administrador:',u.nome);if(n===null)return;const user=prompt('Nome de usuário:',u.username);if(user===null)return;try{alert((await api('/api/operador/administradores/'+u.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:n,username:user})})).mensagem);carregar()}catch(e){alert(e.message)}}
async function reset(u){const s=prompt('Digite a nova senha temporária para '+u.nome+':');if(!s)return;try{alert((await api('/api/operador/administradores/'+u.id+'/redefinir-senha',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({senhaTemporaria:s})})).mensagem);carregar()}catch(e){alert(e.message)}}
async function status(u){if(!confirm((u.ativo?'Desativar':'Ativar')+' a conta de '+u.nome+'?'))return;try{alert((await api('/api/operador/administradores/'+u.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({ativo:!u.ativo})})).mensagem);carregar()}catch(e){alert(e.message)}}
novoForm.onsubmit=async e=>{e.preventDefault();msg.className='msg';msg.textContent='';try{const d=await api('/api/operador/administradores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:nome.value.trim(),username:username.value.trim(),senhaTemporaria:senha.value})});msg.className='msg ok';msg.textContent=d.mensagem;novoForm.reset();carregar()}catch(e){msg.className='msg err';msg.textContent=e.message}}
sair.onclick=async()=>{try{await api('/api/operador/logout',{method:'POST'})}catch(e){}location.href='/operador-login'};
(async()=>{if(await iniciarSessao())carregar()})();
</script></body></html>
