<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrar Ocorrência</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;color:#1f2937}body{min-height:100vh}.login-bg{background:linear-gradient(135deg,#eff6ff,#e0e7ff);display:flex;align-items:center;justify-content:center;padding:24px}.admin-bg{background:linear-gradient(135deg,#f8fafc,#eff6ff)}.user-bg{background:linear-gradient(135deg,#ecfdf5,#f0fdfa)}.container{width:min(1120px,calc(100% - 32px));margin:auto}.card,.panel,.login-card{background:#fff;border-radius:18px;box-shadow:0 20px 50px rgba(15,23,42,.12)}.login-card{width:min(430px,100%);padding:32px}.login-head{text-align:center;margin-bottom:26px}.icon-circle{width:64px;height:64px;border-radius:50%;margin:0 auto 15px;display:grid;place-items:center;background:#e0e7ff;color:#4f46e5;font-size:28px}.login-head h1{margin:0 0 8px;font-size:29px}.muted{color:#6b7280}.role-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px}.role-btn{border:0;border-radius:9px;padding:13px;cursor:pointer;font-weight:600;color:#4b5563;background:#f3f4f6}.role-btn.active{background:#4f46e5;color:#fff}label{display:block;font-size:14px;font-weight:600;margin:0 0 8px}.field{margin-bottom:16px}input,textarea{width:100%;border:1px solid #d1d5db;border-radius:9px;padding:13px 14px;font:inherit;outline:0;background:#fff}input:focus,textarea:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.14)}textarea{resize:vertical;min-height:120px}.btn{border:0;border-radius:9px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn-primary{background:#4f46e5;color:#fff}.btn-green{background:linear-gradient(90deg,#059669,#0d9488);color:#fff}.btn-red{background:#dc2626;color:#fff}.btn-gray{background:#e5e7eb;color:#374151}.btn-ghost{background:transparent;color:#374151}.btn-full{width:100%}.error{color:#dc2626;font-size:14px;min-height:20px;margin:10px 0 0}.success{color:#047857;font-size:14px;min-height:20px;margin-top:10px}.navbar{background:#fff;border-bottom:1px solid #e5e7eb;box-shadow:0 1px 4px rgba(0,0,0,.04)}.nav-inner{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:20px}.nav-title h1{font-size:24px;margin:0 0 4px}.nav-title p{font-size:14px;margin:0;color:#6b7280}.page{padding:42px 0}.menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.user-grid{grid-template-columns:repeat(2,1fr);max-width:760px;margin:auto}.menu-card{background:#fff;border:0;border-radius:18px;padding:30px 22px;box-shadow:0 10px 28px rgba(15,23,42,.10);text-align:center;cursor:pointer;text-decoration:none;color:inherit;transition:.2s}.menu-card:hover{transform:translateY(-4px);box-shadow:0 16px 32px rgba(15,23,42,.14)}.menu-icon{width:76px;height:76px;border-radius:18px;display:grid;place-items:center;margin:0 auto 17px;color:#fff;font-size:32px;position:relative}.red{background:linear-gradient(135deg,#ef4444,#f97316)}.yellow{background:linear-gradient(135deg,#eab308,#ef4444)}.green{background:linear-gradient(135deg,#10b981,#14b8a6)}.blue{background:linear-gradient(135deg,#3b82f6,#6366f1)}.purple{background:linear-gradient(135deg,#a855f7,#6366f1)}.menu-card h2{font-size:20px;margin:0 0 10px}.menu-card p{font-size:14px;color:#6b7280;margin:0;line-height:1.45}.stat-number{font-size:32px!important;font-weight:800!important;margin:4px 0!important}.panel{padding:24px}.panel-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}.panel-header h2{font-size:24px;margin:0 0 6px}.backbar{background:#fff;border-bottom:1px solid #e5e7eb}.back-inner{padding:15px 0}.occ-list{display:grid;gap:15px}.occ-card{border:2px solid;border-radius:13px;padding:18px}.occ-high{border-color:#fecaca;background:#fef2f2}.occ-medium{border-color:#fed7aa;background:#fff7ed}.occ-low{border-color:#fde68a;background:#fffbeb}.occ-row{display:flex;gap:14px}.occ-source{width:48px;height:48px;flex:0 0 48px;border-radius:9px;display:grid;place-items:center;font-size:22px;background:#e0e7ff}.occ-main{flex:1;min-width:0}.occ-head{display:flex;justify-content:space-between;gap:15px}.occ-head h3{margin:0;font-size:18px}.priority-pill{border-radius:6px;padding:5px 8px;font-weight:800;font-size:12px}.priority-high{background:#fee2e2;color:#991b1b}.priority-medium{background:#ffedd5;color:#9a3412}.priority-low{background:#fef9c3;color:#854d0e}.occ-description{margin:10px 0;color:#374151}.occ-meta{display:flex;gap:18px;flex-wrap:wrap;color:#6b7280;font-size:13px}.form-panel{max-width:760px;margin:auto}.priority-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.priority-option{border:2px solid #e5e7eb;background:#fff;border-radius:9px;padding:12px;cursor:pointer;color:#4b5563}.priority-option small{display:block;margin-top:4px}.priority-option.active[data-priority="low"]{border-color:#eab308;background:#fefce8;color:#a16207}.priority-option.active[data-priority="medium"]{border-color:#f97316;background:#fff7ed;color:#c2410c}.priority-option.active[data-priority="high"]{border-color:#ef4444;background:#fef2f2;color:#b91c1c}.info-box{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:9px;padding:14px;font-size:14px;margin:20px 0}.status-box{padding:20px;border-radius:16px;background:#fff;box-shadow:0 10px 28px rgba(15,23,42,.10)}.status-row{display:flex;justify-content:space-between;gap:20px;align-items:center}.switch{position:relative;display:inline-block;width:54px;height:30px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;cursor:pointer;inset:0;background:#cbd5e1;border-radius:999px;transition:.2s}.slider:before{content:"";position:absolute;width:22px;height:22px;left:4px;bottom:4px;background:white;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:#10b981}.switch input:checked+.slider:before{transform:translateX(24px)}.mini{font-size:12px;color:#6b7280}.map-panel{padding:18px}.map-box{height:560px;border-radius:14px;overflow:hidden;background:#e5e7eb}.legend{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0 0;font-size:13px}.legend span{display:flex;align-items:center;gap:7px}.dot{width:12px;height:12px;border-radius:50%}.measure-list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.measure-card{border:1px solid #e5e7eb;border-radius:10px;padding:13px;background:#fff}.measure-card b{display:block;margin-bottom:5px}.measure-card p{margin:3px 0;font-size:13px;color:#6b7280}@media(max-width:900px){.menu-grid{grid-template-columns:repeat(2,1fr)}.measure-list{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.menu-grid,.user-grid,.measure-list,.priority-grid{grid-template-columns:1fr}.nav-inner,.panel-header,.occ-head,.status-row{align-items:flex-start;flex-direction:column}.page{padding:28px 0}.map-box{height:430px}.login-card{padding:24px}}
</style></head><body class="user-bg"><div class="backbar"><div class="container back-inner"><a href="/usuario" class="btn btn-ghost">← Voltar</a></div></div><main class="container page"><section class="panel form-panel"><div class="panel-header"><div><h2>⚠ Registrar Ocorrência</h2><p class="muted">Reporte problemas de iluminação pública</p></div></div><form id="form"><div class="field"><label>Localização</label><input id="location" placeholder="Ex: Praça Santa Rita - Centro" required></div><div class="field"><label>Descrição do Problema</label><textarea id="description" placeholder="Descreva o problema encontrado..." required></textarea></div><div class="field"><label>Nível de Gravidade</label><div class="priority-grid"><button type="button" class="priority-option" data-priority="low"><b>Baixa</b><small>Iluminação reduzida</small></button><button type="button" class="priority-option active" data-priority="medium"><b>Média</b><small>Poste apagado</small></button><button type="button" class="priority-option" data-priority="high"><b>Alta</b><small>Área sem iluminação</small></button></div></div><div class="info-box"><b>Importante:</b> Esta ocorrência fica na área dos responsáveis e não é usada no mapa de calor.</div><button class="btn btn-green btn-full">Enviar Ocorrência</button><p id="msg" class="success"></p></form></section></main></body><script>
async function logout(){await apiFetch('/api/logout',{method:'POST'});location.href='/login'}
function fmtDate(v){return v?new Date(v).toLocaleString('pt-BR'):'—'}
function priorityLabel(p){return({high:'Alta',medium:'Média',low:'Baixa'})[p]||p}
async function apiFetch(url,opcoes={}){const r=await fetch(url,opcoes);if(r.status===403){const d=await r.clone().json().catch(()=>({}));if(d.codigo==='TROCA_SENHA')location.href='/senha'}return r}
</script><script>let priority='medium';document.querySelectorAll('.priority-option').forEach(b=>b.onclick=()=>{priority=b.dataset.priority;document.querySelectorAll('.priority-option').forEach(x=>x.classList.toggle('active',x===b))});form.onsubmit=async e=>{e.preventDefault();const r=await apiFetch('/api/ocorrencias',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:location.value.trim(),description:description.value.trim(),priority})});const d=await r.json();msg.textContent=d.mensagem;if(r.ok){form.reset();setTimeout(()=>location.href='/usuario',700)}}</script></html>
