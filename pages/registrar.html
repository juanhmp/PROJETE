 <body class="user-bg">
  <div class="backbar">
   <div class="container back-inner">
    <a class="btn btn-ghost" href="/usuario">
     ← Voltar
    </a>
   </div>
  </div>
  <main class="container page">
   <section class="panel form-panel">
    <div class="panel-header">
     <div>
      <h2>
       ⚠ Registrar Ocorrência
      </h2>
      <p class="muted">
       Reporte problemas de iluminação pública
      </p>
     </div>
    </div>
    <form id="form">
     <div class="field">
      <label>
       Localização
      </label>
      <input id="location" placeholder="Ex: Praça Santa Rita - Centro" required=""/>
     </div>
     <div class="field">
      <label>
       Descrição do Problema
      </label>
      <textarea id="description" placeholder="Descreva o problema encontrado..." required=""></textarea>
     </div>
     <div class="field">
      <label>
       Nível de Gravidade
      </label>
      <div class="priority-grid">
       <button class="priority-option" data-priority="low" type="button">
        <b>
         Baixa
        </b>
        <small>
         Iluminação reduzida
        </small>
       </button>
       <button class="priority-option active" data-priority="medium" type="button">
        <b>
         Média
        </b>
        <small>
         Poste apagado
        </small>
       </button>
       <button class="priority-option" data-priority="high" type="button">
        <b>
         Alta
        </b>
        <small>
         Área sem iluminação
        </small>
       </button>
      </div>
     </div>
     <div class="field">
      <label>
       Foto do local (opcional)
      </label>
      <div class="photo-upload">
       <input accept="image/*" id="foto" type="file"/>
       <label class="photo-button" for="foto">📷 Escolher foto</label>
       <span class="photo-help">No celular, você pode tirar uma foto ou escolher da galeria · máximo 1 MB</span>
       <div class="photo-selected" id="foto-selecionada">
        <img alt="Pré-visualização da foto" class="photo-preview" id="foto-preview"/>
        <button aria-label="Remover foto" class="remove-photo" id="remover-foto" type="button">×</button>
       </div>
      </div>
     </div>
     <div class="info-box">
      <b>
       Importante:
      </b>
      Esta ocorrência fica na área dos responsáveis e não é usada no mapa de calor.
     </div>
     <button class="btn btn-green btn-full" id="enviar" type="submit">
      Enviar Ocorrência
     </button>
     <p class="error" id="erro"></p>
     <div class="success-box" id="msg">✓ Ocorrência registrada com sucesso!</div>
    </form>
   </section>

 <script>
  async function logout(){await apiFetch('/api/logout',{method:'POST'});location.href='/login'}
function fmtDate(v){return v?new Date(v).toLocaleString('pt-BR'):'—'}
function priorityLabel(p){return({high:'Alta',medium:'Média',low:'Baixa'})[p]||p}
async function apiFetch(url,opcoes={}){const r=await fetch(url,opcoes);if(r.status===403){const d=await r.clone().json().catch(()=>({}));if(d.codigo==='TROCA_SENHA')location.href='/senha'}return r}
 </script>
 <script>
  const form=document.getElementById('form');
  const campoLocalizacao=document.getElementById('location');
  const campoDescricao=document.getElementById('description');
  const campoFoto=document.getElementById('foto');
  const fotoPreview=document.getElementById('foto-preview');
  const fotoSelecionada=document.getElementById('foto-selecionada');
  const removerFoto=document.getElementById('remover-foto');
  const botaoEnviar=document.getElementById('enviar');
  const mensagemSucesso=document.getElementById('msg');
  const mensagemErro=document.getElementById('erro');
  let priority='medium';
  let foto='';

  function limparFoto(){
    foto='';
    campoFoto.value='';
    fotoPreview.removeAttribute('src');
    fotoSelecionada.style.display='none';
  }

  document.querySelectorAll('.priority-option').forEach(botao=>{
    botao.onclick=()=>{
      priority=botao.dataset.priority;
      document.querySelectorAll('.priority-option').forEach(opcao=>{
        opcao.classList.toggle('active',opcao===botao);
      });
    };
  });

  campoFoto.onchange=()=>{
    const arquivo=campoFoto.files[0];
    mensagemErro.textContent='';
    limparFoto();

    if(!arquivo)return;
    if(!arquivo.type.startsWith('image/')){
      mensagemErro.textContent='Selecione um arquivo de imagem.';
      campoFoto.value='';
      return;
    }
    if(arquivo.size>1024*1024){
      mensagemErro.textContent='A foto deve ter no máximo 1 MB.';
      campoFoto.value='';
      return;
    }

    const leitor=new FileReader();
    leitor.onload=()=>{
      foto=leitor.result;
      fotoPreview.src=foto;
      fotoSelecionada.style.display='block';
    };
    leitor.readAsDataURL(arquivo);
  };

  removerFoto.onclick=limparFoto;

  form.onsubmit=async evento=>{
    evento.preventDefault();
    mensagemErro.textContent='';
    mensagemSucesso.style.display='none';
    botaoEnviar.disabled=true;
    botaoEnviar.textContent='Enviando...';

    try{
      const resposta=await apiFetch('/api/ocorrencias',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          location:campoLocalizacao.value.trim(),
          description:campoDescricao.value.trim(),
          priority,
          foto
        })
      });
      const dados=await resposta.json();

      if(!resposta.ok){
        mensagemErro.textContent=dados.mensagem||'Não foi possível registrar a ocorrência.';
        return;
      }

      form.reset();
      priority='medium';
      limparFoto();
      document.querySelectorAll('.priority-option').forEach(opcao=>{
        opcao.classList.toggle('active',opcao.dataset.priority==='medium');
      });
      mensagemSucesso.style.display='block';
    }catch(erro){
      mensagemErro.textContent='Não foi possível conectar ao servidor.';
    }finally{
      botaoEnviar.disabled=false;
      botaoEnviar.textContent='Enviar Ocorrência';
    }
  };
 </script>
