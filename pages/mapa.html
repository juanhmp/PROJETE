;border-radius:9px;display:grid;place-items:center;font-size:22px;background:#e0e7ff}.occ-main{flex:1;min-width:0}.occ-head{display:flex;justify-content:space-between;gap:15px}.occ-head h3{margin:0;font-size:18px}.priority-pill{border-radius:6px;padding:5px 8px;font-weight:800;font-size:12px}.priority-high{background:#fee2e2;color:#991b1b}.priority-medium{background:#ffedd5;color:#9a3412}.priority-low{background:#fef9c3;color:#854d0e}.occ-description{margin:10px 0;color:#374151}.occ-meta{display:flex;gap:18px;flex-wrap:wrap;color:#6b7280;font-size:13px}.form-panel{max-width:760px;margin:auto}.priority-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.priority-option{border:2px solid #e5e7eb;background:#fff;border-radius:9px;padding:12px;cursor:pointer;color:#4b5563}.priority-option small{display:block;margin-top:4px}.priority-option.active[data-priority="low"]{border-color:#eab308;background:#fefce8;color:#a16207}.priority-option.active[data-priority="medium"]{border-color:#f97316;background:#fff7ed;color:#c2410c}.priority-option.active[data-priority="high"]{border-color:#ef4444;background:#fef2f2;color:#b91c1c}.info-box{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:9px;padding:14px;font-size:14px;margin:20px 0}.status-box{padding:20px;border-radius:16px;background:#fff;box-shadow:0 10px 28px rgba(15,23,42,.10)}.status-row{display:flex;justify-content:space-between;gap:20px;align-items:center}.switch{position:relative;display:inline-block;width:54px;height:30px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;cursor:pointer;inset:0;background:#cbd5e1;border-radius:999px;transition:.2s}.slider:before{content:"";position:absolute;width:22px;height:22px;left:4px;bottom:4px;background:white;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:#10b981}.switch input:checked+.slider:before{transform:translateX(24px)}.mini{font-size:12px;color:#6b7280}.map-panel{padding:18px}.map-box{height:560px;border-radius:14px;overflow:hidden;background:#e5e7eb}.legend{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0 0;font-size:13px}.legend span{display:flex;align-items:center;gap:7px}.dot{width:12px;height:12px;border-radius:50%}.measure-list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.measure-card{border:1px solid #e5e7eb;border-radius:10px;padding:13px;background:#fff}.measure-card b{display:block;margin-bottom:5px}.measure-card p{margin:3px 0;font-size:13px;color:#6b7280}@media(max-width:900px){.menu-grid{grid-template-columns:repeat(2,1fr)}.measure-list{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.menu-grid,.user-grid,.measure-list,.priority-grid{grid-template-columns:1fr}.nav-inner,.panel-header,.occ-head,.status-row{align-items:flex-start;flex-direction:column}.page{padding:28px 0}.map-box{height:430px}.login-card{padding:24px}}
</style></head><body class="admin-bg"><div class="backbar"><div class="container back-inner"><button onclick="history.back()" class="btn btn-ghost">← Voltar</button></div></div><main class="container page"><section class="panel map-panel"><div class="panel-header"><div><h2>🗺 Mapa de Calor - Santa Rita do Sapucaí</h2><p class="muted">O mapa mostra apenas áreas agregadas de iluminação. As leituras individuais recebidas do caminhão não são exibidas visualmente.</p></div><button id="refreshBtn" class="btn btn-primary">Atualizar</button></div><div id="map" class="map-box"></div><div class="legend"><span><i class="dot" style="background:#2563eb"></i> Mais iluminada</span><span><i class="dot" style="background:#22c55e"></i> Iluminação boa</span><span><i class="dot" style="background:#eab308"></i> Atenção</span><span><i class="dot" style="background:#ef4444"></i> Menos iluminada</span></div><div id="resumoMapa" class="info-box" style="margin-bottom:0">Aguardando dados do mapa de calor...</div></section></main></body><script>
async function logout(){await apiFetch('/api/logout',{method:'POST'});location.href='/login'}
function fmtDate(v){return v?new Date(v).toLocaleString('pt-BR'):'—'}
function priorityLabel(p){return({high:'Alta',medium:'Média',low:'Baixa'})[p]||p}
async function apiFetch(url,opcoes={}){const r=await fetch(url,opcoes);if(r.status===403){const d=await r.clone().json().catch(()=>({}));if(d.codigo==='TROCA_SENHA')location.href='/senha'}return r}
</script><script>

// Limites apenas para impedir que o usuário navegue para muito longe de Santa Rita.
const limitesCidade=L.latLngBounds(
  [-22.2850,-45.7400],
  [-22.2200,-45.6750]
);

const mapa=L.map('map',{
  maxBounds:limitesCidade,
  maxBoundsViscosity:1.0,
  minZoom:13,
  maxZoom:18
});

mapa.setView([-22.2520,-45.7040],14);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,
  opacity:1,
  attribution:'&copy; OpenStreetMap'
}).addTo(mapa);

// O heatmap fica em uma camada transparente sobre o mapa, sem marcadores individuais.
mapa.createPane('heatPane');
mapa.getPane('heatPane').style.zIndex='450';
mapa.getPane('heatPane').style.opacity='0.68';
mapa.getPane('heatPane').style.pointerEvents='none';

let heat=null;
let areasMapa=[];

function intensidade(luminosidade){
  const valor=Math.max(0,Math.min(100,Number(luminosidade)||0));
  // 100% de luminosidade = baixa intensidade; 0% = alta intensidade.
  return Math.max(0.04,Math.min(0.92,(100-valor)/100));
}

function configuracaoPorZoom(){
  const zoom=mapa.getZoom();
  if(zoom<=13) return {radius:18,blur:16};
  if(zoom===14) return {radius:27,blur:21};
  if(zoom===15) return {radius:34,blur:26};
  if(zoom===16) return {radius:40,blur:30};
  if(zoom===17) return {radius:46,blur:34};
  return {radius:50,blur:38};
}

function desenharHeatmap(){
  if(heat){
    mapa.removeLayer(heat);
    heat=null;
  }

  const validos=areasMapa.filter(a=>
    limitesCidade.contains([Number(a.lat),Number(a.lng)])
  );

  if(!validos.length) return;

  const pontos=validos.map(a=>[
    Number(a.lat),
    Number(a.lng),
    intensidade(a.luminosidade)
  ]);

  const cfg=configuracaoPorZoom();
  heat=L.heatLayer(pontos,{
    radius:cfg.radius,
    blur:cfg.blur,
    max:0.95,
    maxZoom:14,
    minOpacity:0.18,
    pane:'heatPane',
    gradient:{
      0.12:'#2563eb',
      0.32:'#06b6d4',
      0.50:'#22c55e',
      0.67:'#eab308',
      0.82:'#f97316',
      1:'#ef4444'
    }
  }).addTo(mapa);
}

async function carregar(){
  const r=await apiFetch('/api/mapa/calor');
  const dados=await r.json();
  areasMapa=Array.isArray(dados.areas)?dados.areas:[];

  desenharHeatmap();

  const validos=areasMapa.filter(a=>
    limitesCidade.contains([Number(a.lat),Number(a.lng)])
  );

  if(validos.length){
    const totalLeituras=validos.reduce((s,a)=>s+(Number(a.quantidade)||0),0);
    resumoMapa.textContent=`Mapa formado por ${totalLeituras} leituras do último envio, agrupadas em ${validos.length} pequenas áreas. As leituras individuais não são exibidas.`;
  }else{
    resumoMapa.textContent='Ainda não há dados para formar o mapa de calor. No modo de teste, simule a chegada do caminhão à base.';
  }
}

mapa.on('zoomend',desenharHeatmap);
refreshBtn.onclick=carregar;
carregar();
setInterval(carregar,5000);
</script></html>
