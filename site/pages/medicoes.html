<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <title> Medições </title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family:
          Inter,
          Segoe UI,
          Arial,
          sans-serif;
        color: #1f2937;
      }
      body {
        min-height: 100vh;
      }
      .admin-bg {
        background: linear-gradient(135deg, #f8fafc, #eff6ff);
      }
      .container {
        width: min(1120px, calc(100% - 32px));
        margin: auto;
      }
      .panel {
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
        padding: 24px;
      }
      .page {
        padding: 42px 0;
      }
      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        margin-bottom: 22px;
      }
      .panel-header h2 {
        font-size: 24px;
        margin: 0 0 6px;
      }
      .muted {
        color: #6b7280;
      }
      .backbar {
        background: #fff;
        border-bottom: 1px solid #e5e7eb;
      }
      .back-inner {
        padding: 15px 0;
      }
      .btn {
        border: 0;
        border-radius: 9px;
        padding: 12px 16px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .btn-primary {
        background: #4f46e5;
        color: #fff;
      }
      .btn-ghost {
        background: transparent;
        color: #374151;
      }
      .medicoes-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 14px 0 18px;
        border-bottom: 1px solid #e5e7eb;
      }
      .medicoes-resumo {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
        align-items: center;
      }
      .medicoes-resumo strong {
        color: #142c52;
        font-size: 14px;
      }
      .medicoes-resumo span {
        color: #60728d;
        font-size: 12px;
      }
      .medicoes-status {
        min-height: 20px;
        margin: 12px 0 0;
        color: #60728d;
        font-size: 13px;
      }
      .medicoes-status.erro {
        color: #b91c1c;
      }
      .tabela-wrap {
        overflow-x: auto;
        margin-top: 12px;
        border: 1px solid #dce6f5;
        border-radius: 14px;
        background: #fff;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 1120px;
      }
      th,
      td {
        padding: 12px 14px;
        border-bottom: 1px solid #edf2fa;
        text-align: left;
        font-size: 13px;
        white-space: nowrap;
        vertical-align: middle;
      }
      th {
        background: #f5f8ff;
        color: #39506f;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      tbody tr:hover {
        background: #f8fbff;
      }
      .valor-lux {
        display: inline-flex;
        min-width: 58px;
        justify-content: center;
        border-radius: 999px;
        padding: 5px 9px;
        background: #eaf2ff;
        color: #1d4ed8;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .mono {
        font-variant-numeric: tabular-nums;
      }
      .estado-vazio {
        min-height: 230px;
        display: grid;
        place-content: center;
        text-align: center;
        color: #60728d;
        border: 1px dashed #a8c7f3;
        border-radius: 14px;
        background: #f5f9ff;
        margin-top: 14px;
        padding: 24px;
      }
      .estado-vazio b {
        display: block;
        color: #475569;
        margin-bottom: 5px;
      }
      @media (max-width: 600px) {
        .panel-header {
          align-items: flex-start;
          flex-direction: column;
        }
        .page {
          padding: 28px 0;
        }
        .panel {
          padding: 18px;
        }
        .medicoes-toolbar {
          align-items: stretch;
          flex-direction: column;
        }
        .medicoes-toolbar .btn {
          width: 100%;
        }
      }
    </style>
    <link rel="stylesheet" href="/simulacao-assets/identidade.css" />
    <link rel="stylesheet" href="/simulacao-assets/paginas.css" />
  </head>
  <body class="site-original content-page admin-bg">
    <div class="backbar">
      <div class="container back-inner">
        <a class="btn btn-ghost" href="/admin"> ← Voltar </a>
      </div>
    </div>
    <main class="container page">
      <section class="panel">
        <div class="panel-header">
          <div>
            <h2>
              <svg
                class="ls-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M4 4a16 16 0 0 1 16 16M4 10a10 10 0 0 1 10 10" />
                <circle cx="5" cy="19" r="2" />
              </svg>
              Medições
            </h2>
            <p class="muted"> Leituras registradas pelo LightSentinel </p>
          </div>
        </div>

        <div class="medicoes-toolbar">
          <div class="medicoes-resumo">
            <strong id="contador"> 0 medições </strong>
            <span id="ultimaAtualizacao"> Aguardando carregamento </span>
          </div>
          <button class="btn btn-primary" id="atualizar" type="button"> ↻ Atualizar </button>
        </div>

        <div class="medicoes-status" id="status" aria-live="polite"></div>
        <div id="conteudo">
          <div class="estado-vazio">
            <b>Carregando medições...</b><span>Aguarde um instante.</span>
          </div>
        </div>
      </section>
    </main>

    <script>
      const conteudo = document.getElementById('conteudo');
      const contador = document.getElementById('contador');
      const ultimaAtualizacao = document.getElementById('ultimaAtualizacao');
      const status = document.getElementById('status');
      const atualizar = document.getElementById('atualizar');

      function texto(valor) {
        return valor === null || valor === undefined || valor === '' ? '—' : String(valor);
      }

      function escapar(valor) {
        return texto(valor)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;');
      }

      function dataHora(valor) {
        if (!valor) return '—';
        const data = new Date(valor);
        if (Number.isNaN(data.getTime())) return texto(valor);
        return new Intl.DateTimeFormat('pt-BR', {
          timeZone: 'America/Sao_Paulo',
          dateStyle: 'short',
          timeStyle: 'medium',
        }).format(data);
      }

      function numero(valor, casas = 0) {
        const n = Number(valor);
        if (!Number.isFinite(n)) return '—';
        return n.toLocaleString('pt-BR', {
          minimumFractionDigits: casas,
          maximumFractionDigits: casas,
        });
      }

      function tabela(medicoes) {
        if (!medicoes.length) {
          return '<div class="estado-vazio"><b>Nenhuma medição registrada.</b><span>As leituras aparecerão aqui depois de serem recebidas pelo sistema.</span></div>';
        }

        return `<div class="tabela-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Luminosidade</th>
                <th>Latitude</th>
                <th>Longitude</th>
                <th>Local</th>
                <th>Origem</th>
                <th>Lote</th>
                <th>Data e hora</th>
                <th>Velocidade</th>
                <th>Satélites</th>
              </tr>
            </thead>
            <tbody>
              ${medicoes
                .map(
                  (m) => `<tr>
                    <td class="mono">${escapar(m.id)}</td>
                    <td><span class="valor-lux">${escapar(numero(m.luminosidade, 1))}</span></td>
                    <td class="mono">${escapar(numero(m.lat, 6))}</td>
                    <td class="mono">${escapar(numero(m.lng, 6))}</td>
                    <td>${escapar(m.local)}</td>
                    <td>${escapar(m.origem)}</td>
                    <td>${escapar(m.lote_id)}</td>
                    <td>${escapar(dataHora(m.timestamp))}</td>
                    <td class="mono">${
                      m.velocidade === null || m.velocidade === undefined
                        ? '—'
                        : `${escapar(numero(m.velocidade, 0))} km/h`
                    }</td>
                    <td class="mono">${escapar(m.satelites)}</td>
                  </tr>`
                )
                .join('')}
            </tbody>
          </table>
        </div>`;
      }

      async function carregarMedicoes() {
        atualizar.disabled = true;
        const textoBotao = atualizar.textContent;
        atualizar.textContent = 'Atualizando...';
        status.textContent = '';
        status.classList.remove('erro');

        try {
          const resposta = await fetch('/api/medicoes?limite=1000', {
            headers: { Accept: 'application/json' },
            cache: 'no-store',
          });

          if (resposta.status === 401) {
            location.href = '/login-admin';
            return;
          }

          if (resposta.status === 403) {
            throw new Error('Seu acesso não permite visualizar as medições.');
          }

          const dados = await resposta.json();
          if (!resposta.ok) {
            throw new Error(dados.mensagem || 'Não foi possível carregar as medições.');
          }

          const medicoes = Array.isArray(dados) ? dados : [];
          conteudo.innerHTML = tabela(medicoes);
          contador.textContent = medicoes.length === 1 ? '1 medição' : `${medicoes.length} medições`;
          ultimaAtualizacao.textContent = `Atualizado às ${new Date().toLocaleTimeString('pt-BR', {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
          })}`;
        } catch (erro) {
          status.textContent = erro.message;
          status.classList.add('erro');
        } finally {
          atualizar.disabled = false;
          atualizar.textContent = textoBotao;
        }
      }

      atualizar.addEventListener('click', carregarMedicoes);
      carregarMedicoes();
    </script>
  </body>
</html>
